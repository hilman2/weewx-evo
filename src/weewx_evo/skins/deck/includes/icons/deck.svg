<svg
  xmlns="http://www.w3.org/2000/svg"
  width="32"
  height="32"
  viewBox="0 0 32 32"
  aria-hidden="true"
>
  <!--
    The mark in the header. What it replaces was weewx-wdc's own logo, 198
    lines of it, on every page this skin writes: another project's badge on
    somebody's weather station.

    It takes its colour from the skin rather than carrying one, because the
    file is inlined into the page -- so `var(--accent)` resolves, and the
    mark follows a theme instead of being blue in both.

    The fallback is this skin's own accent written out, not the blue that
    was here: a fallback nobody reaches is still a hex code somebody greps
    for, and finding the old one in the page is finding the old logo.
  -->
  <rect width="32" height="32" rx="7" fill="var(--accent, #137ac3)" />
  <circle cx="16" cy="13" r="4.5" fill="none" stroke="#fff" stroke-width="2" />
  <path
    d="M16 4.5v2M16 19.5v2M7.5 13h2M22.5 13h2M10 7l1.4 1.4M20.6 17.6 22 19M22 7l-1.4 1.4M11.4 17.6 10 19"
    stroke="#fff"
    stroke-width="1.8"
    stroke-linecap="round"
  />
  <path
    d="M6 25.5h6M14 25.5h12M9 28.5h14"
    stroke="#fff"
    stroke-width="1.8"
    stroke-linecap="round"
    opacity="0.85"
  />
</svg>
