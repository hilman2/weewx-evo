# The Deck skin.
#
# Deck began as weewx-wdc by David Baetge (GPL v3). What these settings do is
# in docs/Deck.md, and what is different from that project is in CHANGES.md
# beside this file.
#
# The links here used to point at upstream's wiki. They described that skin
# rather than this one -- this draws with ECharts, so everything Nivo-shaped
# is gone -- and a page that names a setting which no longer exists costs
# more than it gives.
SKIN_NAME = Deck
SKIN_VERSION = 3.5.1+evo

[Extras]
    # Only change this if the generated files are deployed to some
    # sub-folder of your web server.
    # E.g. if the site is reached at "https://example.org/weather/", the
    # base_path is "/weather/".
    base_path = /

    # Full URL to your own, custom logo (top left - works best as 32 x 32px).
    #logo_image = ""

    # If activated the Fontpage (index.html) will be automatically be
    # refreshed in the browser every 300 seconds.
    #refresh_interval = 300

    # Show a link to the GitHub respository of this skin. Set to False to hide.
    github_link = True

    # Where the chart files are, as the browser sees them. They come from
    # the `json` feed, which writes one per plot in `plots.toml`, and that is
    # a separate export from these pages -- so this cannot be worked out here
    # and has to be said. The default is what the built-in web server serves
    # a local export named `json` at.
    charts_path = "/json/"

    # The radar code. Full html allowed.
    #radar_html = ''

    # The Foreacst/Radar/Webcam section heading.
    #forecast_radar_heading = "Forecast & Recent radar"

    # Open the radar and external images/videos in a modal.
    open_radar_and_externals_modal = False

    # Set to True to have the Forecast tile and the radar/externals tile to have the same width.
    # Default is forecast = 2/3 and radar tile = 1/3.

    # Live readings. The station POSTs them to the live.php that ships with
    # this skin, which writes them beside itself; the page reads that file.
    #
    # Nothing is opened anywhere for this. The file is served by the same web
    # server as the page, over the same https, from the same origin -- so no
    # broker, no port forwarded through a router, and no certificate to keep
    # valid. It works from behind CGNAT and off a mobile connection.
    #
    # What it gives up is push all the way to the browser: the page polls, so
    # a reading is as fresh as `live_push_every`. Fifteen seconds against an
    # archive record's five minutes.
    #
    # Set up the `webpush` upload in weewx-evo and put its token in a file
    # called `live.token` beside live.php on the web host.
    live_push = 1
    live_push_file = "live.json"
    live_push_every = 15

    # See docs/Deck.md, "Webcams and other externals".
    # Include various external sources (eg. webcams) here.
    #[[externals]]
    #    description = 'This description will be shown at the Webcams/Externals page.
    #
    #    [[[current_backyard_image]]]
    #        source = '<img src="https://my-server.com/current/image.jpg" />'
    #        title = Current image
    #        title_long = "Webcam facing North"
    #        description = 'The image is updated every 80 seconds, nighttime every 100 seconds.'
    #        show_on_front = True
    #        show_on_page = True

    # The forecast. It comes from weewx-evo itself -- configure a source on
    # the settings page and this shows it. Nothing to install.
    # Named `forecast_settings` rather than `forecast`: every key here
    # becomes a top-level tag, and [Extras] is searched before the tag layer.
    # A section called `forecast` shadows `$forecast` itself.
    [[forecast_settings]]
        enable = True

        # Which source, when more than one is configured. Empty means all of
        # them, which is the right answer while there is only one.
        source = ""

        # How many days across the top. A source that has fewer says so by
        # showing fewer.
        days = 7

        # Click a day and its hours appear below. How coarse those are:
        # every third hour is eight tiles for a day, which fits a row on any
        # screen. Twenty-four was a wall of nearly identical clouds. Nothing
        # is lost by it -- each tile carries the worst of the three hours it
        # stands for, so a shower at five o'clock still shows.
        show_hours = True
        hour_step = 3

        # Official warnings, the ones covering right now, worst first. On by
        # default: this is the one thing on the page somebody needs to see
        # before they read anything else.
        show_warnings = True

        heading = "Forecast"


[DisplayOptions]
    # 'alternative' or 'classic'.
    layout = 'alternative'

    # 'auto', 'light' or 'dark'.
    default_theme = 'auto'

    # Date/Time localization for charts. Available locales: de-DE, en-US, en-GB, it-IT, nl-NL.
    # If not set, the value from weewx.conf (reports section) will be used. If lang = en, then en-US will be used (sorry GB!).
    #date_time_locale = en-US

    # These days will be shown on the year and statistics pages.
    climatological_days = rainDays, summerDays, hotDays, desertDays, tropicalNights, stormDays, iceDays, frostDays
    climatological_days_per_month = True
    show_last_rain = True
    show_most_days_with_rain = True
    show_most_days_without_rain = True
    show_most_rain_within_one_day = True

    # What to show in the tables.
    table_tile_observations = outTemp, outHumidity, barometer, windSpeed, windGust, windDir, rain, rainRate, snowDepth, dewpoint, windchill, heatindex, UV, ET, radiation, appTemp, cloudbase, extraTemp1, extraHumid1, extraTemp2, extraHumid2, extraTemp3, extraHumid3, extraTemp4, extraHumid4, extraTemp5, extraHumid5, extraTemp6, extraHumid6, extraTemp7, extraHumid7, extraTemp8, extraHumid8

    # What to show for the stat tiles.
    stat_tile_observations = outTemp, outHumidity, barometer, windSpeed, windDir, windGust, windGustDir, windrun, rain, rainRate, snowDepth, dewpoint, windchill, heatindex, UV, ET, radiation, appTemp, cloudbase, extraTemp1, extraHumid1, extraTemp2, extraHumid2, extraTemp3, extraHumid3, extraTemp4, extraHumid4, extraTemp5, extraHumid5, extraTemp6, extraHumid6, extraTemp7, extraHumid7, extraTemp8, extraHumid8

    # Stat tiles: Min/Max/Sum settings.
    stat_tiles_show_min = outTemp, outHumidity, barometer, pressure, altimeter, snowDepth, heatindex, dewpoint, windchill, cloudbase, appTemp, rxCheckPercent, consBatteryVoltage
    stat_tiles_show_max = rainRate, hailRate, snowRate, UV
    stat_tiles_show_sum = rain, ET, hail, snow, lightning_strike_count, windrun

    # Stat tiles: show time when the min/max was reached.
    show_min_max_time_day = False
    show_min_max_time_yesterday = False
    show_min_max_time_week = False
    show_min_max_time_month = False

    # Color the outTemp stat tile based on the temperature. Only available for alternative layout.
    outTemp_stat_tile_color = False
    outTemp_stat_tile_color_transparency = 0.35
    outTemp_stat_tile_color_min = -20
    outTemp_stat_tile_color_max = 40

    # windDir as oridnals (N, E, S, W).
    stat_tile_winddir_ordinal = True
    diagram_tile_winddir_ordinal = True

    # Windrose.
    windRose_colors = "#f3cec9", "#e7a4b6", "#cd7eaf", "#a262a9", "#6f4d96", "#3d3b72"
    windRose_show_beaufort = True
    windRose_legend_show_units = True

    # Climatogram on year and statistics pages.
    climatogram_enable_stats = True
    climatogram_enable_year_stats = True

    # Sensor status page.
    # See docs/Deck.md, "Sensor status".
    sensor_stat_tile_observations = rxCheckPercent, signal1, signal2, signal3, signal4, signal5, signal6, signal7, signal8, consBatteryVoltage, heatingVoltage, supplyVoltage, referenceVoltage
    sensor_diagram_observations = rxCheckPercent, signal1, signal2, signal3, signal4, signal5, signal6, signal7, signal8, consBatteryVoltage, heatingVoltage, supplyVoltage, referenceVoltage
    sensor_table_observations = rxCheckPercent, signal1, signal2, signal3, signal4, signal5, signal6, signal7, signal8, consBatteryVoltage, heatingVoltage, supplyVoltage, referenceVoltage
    sensor_battery_status = outTempBatteryStatus, inTempBatteryStatus, rainBatteryStatus, hailBatteryStatus, snowBatteryStatus, windBatteryStatus, uvBatteryStatus, txBatteryStatus, batteryStatus1, batteryStatus2, batteryStatus3, batteryStatus4, batteryStatus5, batteryStatus6, batteryStatus7, batteryStatus8
    # Time period of diagrams (day, week, month or year).
    sensor_diagram_period = week

    # Computer monitor page.
    # The readings weewx-cmon records. See docs/Deck.md, "The pages".
    computer_monitor_stat_tile_observations = cpu_user, cpu_system, cpu_temp, load1, load5, load15, mem_used, mem_free, net_eth0_rbytes, net_eth0_rpackets, net_eth0_tbytes, net_eth0_tpackets, net_wlan0_rbytes, net_wlan0_rpackets, net_wlan0_tbytes, net_wlan0_tpackets, proc_active, proc_total
    computer_monitor_diagram_observations = cpu_user, cpu_system, cpu_temp, load1, mem_used, proc_active, net_eth0_rbytes, net_eth0_tbytes, net_wlan0_rbytes, net_wlan0_tbytes
    computer_monitor_table_observations = cpu_user, cpu_system, cpu_temp, load1, load5, load15, mem_used, mem_free, net_eth0_rbytes, net_eth0_rpackets, net_eth0_tbytes, net_eth0_tpackets, net_wlan0_rbytes, net_wlan0_rpackets, net_wlan0_tbytes, net_wlan0_tpackets, proc_active, proc_total
    computer_monitor_diagram_period = week

    # Several places on one site. None of this does anything where weewx-evo
    # keeps one measurement series: the overview and the comparison pages are
    # not rendered at all there, and every include that reads these settings
    # renders nothing.
    #
    # Which places are shown, in what order, and which pages each of them
    # gets are the *feed's* settings and not these -- they are named values
    # one operator sets per instance, so they live in `options.py` and appear
    # on the feed's own page. A place's colour, its short code and its order
    # are `archives.toml`'s, so every renderer paints the same place the same
    # colour.

    # The board on the overview: one column per reading, in this order. A
    # column no place records is left out rather than filled with dashes.
    board_observations = outTemp, outHumidity, windSpeed, rain, barometer
    # The reading the one chart on the overview draws, and the one the spread
    # rule below watches.
    board_primary = outTemp
    # Say so when two places' current board_primary differ by more than this,
    # in the unit the pages are shown in. A threshold converted the wrong way
    # is amber at 79 on a Fahrenheit page and silent at 26.
    unusual_spread = 2.0
    # Past four the list stops reading as news and starts reading as a log.
    unusual_max = 4

    # The comparison pages: one file per period, one chart and one row of the
    # figures table per reading.
    compare_spans = day, week, month, year
    compare_observations = outTemp, outHumidity, windSpeed, rain

    # See docs/Deck.md, "Gauges".
    # Only applies when using the alternative layout.
    # One of 'before' or 'after'.
    gauges_display = before
    # One of small, medium or large.
    gauges_size = medium

    [[Gauges]]
        arc = 1.2
        offset = 20
        # normal or invert
        mode = normal
        show_min_max = 1

    # See docs/Deck.md, "Extended aggregates".
    # ONLY enable these if you have weewx-xaggs installed!
    #[[stat_tiles_xaggs]]
    #    [[[outTemp]]]
    #        aggregate_types = historical_max, historical_min, historical_avg, avg_ge_1, avg_ge_2, avg_ge_3
    #        avg_ge_1 = 5.0, 'degree_C', 'group_temperature'
    #        avg_ge_2 = 10.0, 'degree_C', 'group_temperature'
    #        avg_ge_3 = 15.0, 'degree_C', 'group_temperature'
    #        show_extra_row = False
    #        avg_context = year, alltime

    [[Icons]]
        #rain = "includes/icons/barometer.svg"

    #[[Rounding]]
        #dewpoint = 3

    # See docs/Deck.md, "Stat tables".
    [[stat_tables]]
        [[[tables_outtemp]]]
            observation = "outTemp"
            label = "Temperature Stat Table"
            aggregate_types = "min", "avg", "max"
        [[[tables_rain]]]
            observation = "rain"
            label = "Rain Stat Table"
            # Totals only. The average per month is the row at the bottom
            # of the same table, which is where it belongs: a second table
            # that looks the same and means something else is worse than
            # no second table.
            aggregate_types = "sum"

    [[tables]]
        #[[[Rounding]]]
            #outTemp = 3
        [[[day]]]
            aggregate_interval = 3600  # 1 hour
        [[[week]]]
            aggregate_interval = 21600  # 6 hours
        [[[month]]]
            aggregate_interval = 43200  # 12 hours
        [[[year]]]
            aggregate_interval = 86400  # 1 day
        [[[alltime]]]
            aggregate_interval = 86400  # 1 day

    [[diagrams]]
        #[[[Rounding]]]
            #barometer = 3

        [[[combined_observations]]]
            [[[[climatogram_year]]]]
                label = "Climatogram"
                curve="natural"
                aggregate_interval = month
                bottom_date_time_format = "%b"
                tooltip_date_time_format = "%B"
                [[[[[obs]]]]]
                    [[[[[[rain]]]]]]
                        observation = "rain"
                    [[[[[[outTemp]]]]]]
                        observation = "outTemp"

            [[[[climatogram_statistics]]]]
                label = "Climatogram"
                curve="natural"
                aggregate_interval = year
                bottom_date_time_format = "%Y"
                tooltip_date_time_format = "%Y"
                [[[[[obs]]]]]
                    [[[[[[rain]]]]]]
                        observation = "rain"
                    [[[[[[outTemp]]]]]]
                        observation = "outTemp"

            [[[[temp_min_max_avg]]]]
                label = "Temperature Min/Max/Avg"
                markerValue = 0
                markerColor = "#00BFFF"
                [[[[[obs]]]]]
                    [[[[[[outTemp_max]]]]]]
                        observation = "outTemp"
                        aggregate_type = "max"
                        color = "#8B0000"
                    [[[[[[outTemp_average]]]]]]
                        observation = "outTemp"
                        aggregate_type = "avg"
                        color = "#666666"
                    [[[[[[outTemp_min]]]]]]
                        observation = "outTemp"
                        aggregate_type = "min"
                        color = "#0198E1"

            [[[[tempdew]]]]
                label = 'Temperature / Dewpoint'
                markerValue = 0
                markerColor = "#00BFFF"
                [[[[[obs]]]]]
                    [[[[[[temp]]]]]]
                        observation = "outTemp"
                    [[[[[[dew]]]]]]
                        observation = "dewpoint"
                        color = "#5F9EA0"

            [[[[windchill_heatindex]]]]
                label = 'Windchill / Heatindex'
                markerValue = 0
                markerColor = "#00BFFF"
                [[[[[obs]]]]]
                    [[[[[[chill]]]]]]
                        observation = "windchill"
                        color = '#0099CC'
                    [[[[[[heat]]]]]]
                        observation = "heatindex"
                        color = '#610000'

            [[[[wind]]]]
                label = 'Wind speed / Gust speed'
                enableArea = True
                areaOpacity = 0.5
                curve = linear
                [[[[[obs]]]]]
                    [[[[[[gust]]]]]]
                        observation = "windGust"
                        color = "#666666"
                    [[[[[[speed]]]]]]
                        observation = "windSpeed"
                        color = "#ffc000"

        # Diagram-type specific settings.
        [[[line]]]
            lineWidth = 2
            enableArea = False
            areaOpacity = 0.07
            # Only read when this span is set to `source = observations`; see
            # docs/Deck.md, "Where the charts come from".
            curve = "natural"
        [[[bar]]]

        # Observation specific settings.
        [[[outTemp]]]
            type = line
            color = "#8B0000"
        [[[dewpoint]]]
            type = line
            color = "#5F9EA0"
        [[[outHumidity]]]
            type = line
            enableArea = True
            color = "#0099CC"
        [[[pressure]]]
            type = line
            enableArea = True
            color = "#666666"
        [[[barometer]]]
            type = line
            enableArea = True
            color = "#666666"
        [[[altimeter]]]
            type = line
            enableArea = True
            color = "#666666"
        [[[windchill]]]
            type = line
            color = "#0099CC"
        [[[heatindex]]]
            type = line
            color = "#610000"
        [[[windDir]]]
            curve = "basis"
            lineWidth = 0
            type = line
            color = "#161616"
        [[[windSpeed]]]
            type = line
            enableArea = True
            color = "#ffc000"
        [[[windGust]]]
            aggregate_type = "max"
            type = line
            enableArea = True
            color = "#666666"
        [[[rain]]]
            aggregate_type = "sum"
            type = bar
            color = "#0198E1"
        [[[rainRate]]]
            aggregate_type = "max"
            curve = "linear"
            type = line
            color = "#0a6794"
        [[[UV]]]
            aggregate_type = "max"
            curve = "step"
            type = line
            enableArea = True
            color = "#e61919"
        [[[ET]]]
            aggregate_type = "sum"
            type = bar
            color = "#E97451"
        [[[radiation]]]
            curve = "basis"
            type = line
            enableArea = True
            color = "#ff8c00"
        [[[cloudbase]]]
            type = line
            enableArea = True
            color = "#92b6f0"
        [[[appTemp]]]
            type = line
            color = "#C41E3A"
            markerValue = 0
            markerColor = "#00BFFF"
        [[[rxCheckPercent]]]
            color = "#990033"
        [[[consBatteryVoltage]]]
            color = "#666699"
        [[[heatingVoltage]]]
        [[[supplyVoltage]]]
        [[[referenceVoltage]]]


        # Set which diagrams you want to see on the day, week month, etc pages.
        # Note for alltime: if aggregate_interval is not set,
        # it will be calculated automatically based on the number of days/records.
        [[[day]]]
            aggregate_interval = 1800 # 30 minutes
            bottom_date_time_format = "%H:%M"
            tooltip_date_time_format = "%x %X"
            [[[[observations]]]]
                [[[[[tempdew]]]]]
                [[[[[outHumidity]]]]]
                [[[[[barometer]]]]]
                [[[[[windchill_heatindex]]]]]
                [[[[[wind]]]]]
                [[[[[windDir]]]]]
                [[[[[windRose]]]]]
                [[[[[rain]]]]]
                    aggregate_interval = 7200  # 2 hours
                    tooltip_date_time_format = "%X"
                [[[[[rainRate]]]]]
                [[[[[UV]]]]]
                [[[[[ET]]]]]
                    aggregate_interval = 7200  # 2 hours
                    tooltip_date_time_format = "%X"
                [[[[[radiation]]]]]
                [[[[[cloudbase]]]]]
                [[[[[appTemp]]]]]

        [[[week]]]
            aggregate_interval = 7200  # 2 hours
            bottom_date_time_format = "%m/%d"
            tooltip_date_time_format = "%x %X"
            [[[[observations]]]]
                [[[[[tempdew]]]]]
                [[[[[outHumidity]]]]]
                [[[[[barometer]]]]]
                [[[[[windchill_heatindex]]]]]
                [[[[[wind]]]]]
                [[[[[windDir]]]]]
                [[[[[windRose]]]]]
                [[[[[rain]]]]]
                    aggregate_interval = 86400  # 1 day
                    tooltip_date_time_format = "%x"
                [[[[[rainRate]]]]]
                [[[[[UV]]]]]
                [[[[[ET]]]]]
                    aggregate_interval = 86400  # 1 day
                    tooltip_date_time_format = "%x"
                [[[[[radiation]]]]]
                [[[[[cloudbase]]]]]
                [[[[[appTemp]]]]]

        [[[month]]]
            aggregate_interval = 21600  # 6 hours
            bottom_date_time_format = "%m/%d"
            tooltip_date_time_format = "%x %X"
            [[[[observations]]]]
                [[[[[temp_min_max_avg]]]]]
                [[[[[tempdew]]]]]
                [[[[[outHumidity]]]]]
                [[[[[barometer]]]]]
                [[[[[windchill_heatindex]]]]]
                [[[[[wind]]]]]
                [[[[[windDir]]]]]
                [[[[[windRose]]]]]
                [[[[[rain]]]]]
                    aggregate_interval = 172800  # 2 days
                    tooltip_date_time_format = "%x"
                [[[[[rainRate]]]]]
                [[[[[UV]]]]]
                [[[[[ET]]]]]
                    aggregate_interval = 172800  # 2 days
                    tooltip_date_time_format = "%x"
                [[[[[radiation]]]]]
                [[[[[cloudbase]]]]]
                [[[[[appTemp]]]]]

        [[[year]]]
            aggregate_interval = 172800  # 2 days
            bottom_date_time_format = "%m/%d"
            tooltip_date_time_format = "%x"
            [[[[observations]]]]
                [[[[[temp_min_max_avg]]]]]
                [[[[[tempdew]]]]]
                [[[[[outHumidity]]]]]
                [[[[[barometer]]]]]
                [[[[[windchill_heatindex]]]]]
                [[[[[wind]]]]]
                [[[[[windDir]]]]]
                [[[[[windRose]]]]]
                [[[[[rain]]]]]
                    aggregate_interval = 1555200  # 8 days
                [[[[[rainRate]]]]]
                [[[[[UV]]]]]
                [[[[[ET]]]]]
                    aggregate_interval = 1555200  # 8 days
                [[[[[radiation]]]]]
                [[[[[cloudbase]]]]]
                [[[[[appTemp]]]]]


        [[[alltime]]]
            bottom_date_time_format = "%m/%y"
            tooltip_date_time_format = "%m/%Y"
            [[[[observations]]]]
                [[[[[temp_min_max_avg]]]]]
                [[[[[tempdew]]]]]
                [[[[[outHumidity]]]]]
                [[[[[barometer]]]]]
                [[[[[windchill_heatindex]]]]]
                [[[[[wind]]]]]
                [[[[[windDir]]]]]
                [[[[[windRose]]]]]
                [[[[[rain]]]]]
                [[[[[rainRate]]]]]
                [[[[[UV]]]]]
                [[[[[ET]]]]]
                [[[[[radiation]]]]]
                [[[[[cloudbase]]]]]
                [[[[[appTemp]]]]]

        # Diagram heights.
        [[[heights]]]
            [[[[classic]]]]
                height = "220px"
                height_md = "300px"
                height_lg = "250px"
                height_xlg = "225px"
                height_max = "225px"
            [[[[alternative]]]]
                height = "220px"
                height_md = "325px"
                height_lg = "325px"
                height_xlg = "250px"
                height_max = "250px"

[CheetahGenerator]
    encoding = html_entities
    search_list_extensions = weewx_evo.skins.deck.tags.GeneralUtil, weewx_evo.skins.deck.tags.StatsUtil, weewx_evo.skins.deck.tags.DiagramUtil, weewx_evo.skins.deck.tags.CelestialUtil, weewx_evo.skins.deck.tags.ArchiveUtil, weewx_evo.skins.deck.tags.TableUtil, weewx_evo.skins.deck.tags.RainTags, weewx_evo.skins.deck.tags.PlacesUtil

    #[[SummaryByDay]]
    #    [[[summary_day]]]
    #        template = day-archive/day-%Y-%m-%d.html.tmpl

    # `place_page` is one word per page, inherited, and it exists so an
    # operator with five places can publish four pages each instead of
    # forty-five: `place_pages` on the feed's settings page names the words to
    # keep, and an empty list keeps all of them. The words are this skin's
    # own -- the core learns nothing about any particular skin from them, and
    # a skin from outside that names none is untouched.
    [[SummaryByMonth]]
        # Reports that summarize "by month"
        [[[NOAA_month]]]
            encoding = normalized_ascii
            template = NOAA/NOAA-%Y-%m.txt.tmpl
            place_page = archive
            #stale_age = 3600 # Every hour
        [[[summary_month]]]
            template = month-%Y-%m.html.tmpl
            place_page = archive
            #stale_age = 3600 # Every hour

    [[SummaryByYear]]
        # Reports that summarize "by year"
        [[[NOAA_year]]]
            encoding = normalized_ascii
            template = NOAA/NOAA-%Y.txt.tmpl
            place_page = archive
            #stale_age = 3600 # Every hour
        [[[summary_year]]]
            template = year-%Y.html.tmpl
            place_page = archive
            #stale_age = 3600 # Every hour

    # Reports that show statistics "to date", such as day-to-date,
    # week-to-date, month-to-date, etc.
    [[ToDate]]
        [[[day]]]
            template = index.html.tmpl
            place_page = today

        #[[[yesterday]]]
        #    template = yesterday.html.tmpl
        #    place_page = yesterday

        [[[week]]]
            template = week.html.tmpl
            place_page = week

        [[[month]]]
            template = month.html.tmpl
            place_page = month

        [[[year]]]
            template = year.html.tmpl
            place_page = year
            #stale_age = 3600 # Every hour

        [[[statistics]]]
            template = statistics.html.tmpl
            place_page = statistics
            stale_age = 43200 # Twice a day

        [[[celestial]]]
            template = celestial.html.tmpl
            place_page = celestial

        #[[[sensor_status]]]
        #    template = sensor-status.html.tmpl
        #    place_page = sensors

        #[[[computer_monitor]]]
        #    template = computer-monitor.html.tmpl
        #    place_page = monitor

    # Pages about the *site* rather than about one place. Rendered once, at
    # the root, and only when this feed shows more than one place. A skin
    # without this section is still multi-place: its pages are rendered once
    # per place and its site simply has no overview.
    #
    # `scope` is one inherited word, so it covers everything below it.
    #
    # The offline page, the web app manifest and the service worker live here
    # and not one per place: under one origin a root-scoped service worker
    # would otherwise give a browser competing install identities, and the
    # offline page a worker serves has to be where the worker is.
    [[Site]]
        scope = site

        [[[overview]]]
            template = overview.html.tmpl
            # The root's `index.html` and each place's `index.html` are
            # different pages, and two templates in one skin directory cannot
            # both be called `index.html.tmpl`. So the section says what the
            # file is called.
            filename = index.html

        [[[compare_day]]]
            template = compare.html.tmpl

        [[[compare_week]]]
            template = compare-week.html.tmpl

        [[[compare_month]]]
            template = compare-month.html.tmpl

        [[[compare_year]]]
            template = compare-year.html.tmpl

        [[[offline]]]
            template = offline.html.tmpl

        [[[manifest]]]
            template = manifest.json.tmpl

    [[Org]]
        # These two are also here, and that is not an oversight. A
        # `scope = site` section is not rendered at all where the feed shows
        # one place -- it cannot be, or the overview would be written over
        # that place's own `index.html` -- so without this pair a one-place
        # site would lose its manifest and its offline page.
        #
        # `scope = solo` is the mirror of `site`: rendered only where there
        # is one place. Written per place as well, they were N copies nothing
        # linked -- every page asks for the root manifest -- and two
        # manifests on one origin give a browser competing install
        # identities. `service-worker.js` asks for `/offline.html` by
        # absolute path, so the root copy is the one that matters either way.
        [[[offline]]]
            template = offline.html.tmpl
            scope = solo

        [[[manifest]]]
            template = manifest.json.tmpl
            scope = solo

    # Static pages, add as many as you want. Each one is a template in the
    # skin directory and a title for the menu.
    [[Static]]
        #[[[externals]]]
            #template = externals.html.tmpl
            #title = Webcams/Externals

[Units]
    [[TimeFormats]]
        # @see https://weewx.com/docs/customizing.htm#Units_TimeFormats
        day        = %X
        week       = %x
        month      = %x
        year       = %x
        rainyear   = %x
        current    = %x %X
        ephem_day  = %X
        ephem_year = %x
        stats      = %x %X
        daily_archive = %Y-%m-%d

[CopyGenerator]
    copy_once = assets, vendor, favicon.ico, icon-192x192.png, icon-256x256.png, icon-384x384.png, icon-512x512.png, service-worker.js
    # copy_always =

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
