# The overview skin: several measurement series on one page.
#
# Everything else here reads one archive, and that is the point of archives
# being separate -- a page of the north field cannot accidentally print the
# south field's readings, because it has no way to reach them.
#
# This is the deliberate way past that. `$archives.<name>` names a series out
# loud, so there is no ambiguity to get wrong, and a skin that does not
# mention it still sees one archive and nothing else.
#
# It is small on purpose. What it demonstrates is one tag; a station wanting
# a designed overview page starts from this and takes it wherever it likes.

SKIN_NAME = Overview
SKIN_VERSION = 1.0

[CheetahGenerator]
    # utf8, not html_entities. The page is written in German
    # and served with a charset, so entities buy nothing --
    # and the template already declares UTF-8, so encoding it
    # a second time turns Südfeld into S&#195;&#188;dfeld.
    encoding = utf8

    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl

[CopyGenerator]
    copy_once = overview.css

[Units]
    [[Groups]]
        group_temperature = degree_C
        group_pressure = mbar
        group_speed = km_per_hour
        group_rain = mm

    [[Labels]]
        degree_C = " °C"
        mbar = " mbar"
        km_per_hour = " km/h"
        mm = " mm"

[Labels]
    [[Generic]]
        outTemp = Temperatur
        outHumidity = Luftfeuchte
        barometer = Luftdruck
        windSpeed = Wind
        rain = Regen
