# The charts weewx-evo produces.
#
# Each [[plot]] is one chart; each [[plot.line]] is one reading in it.
# 'span' groups plots for the manifest and for the admin page;
# 'time_length' is what actually decides how far back it reaches
# (a number of seconds, or 27h, 7d, and so on).
#
# Leave 'aggregate' out for the archive records themselves. Set it to
# min, max, avg or sum with an 'interval' of 'day' for the coarser
# plots -- a year of five-minute readings is not a chart, it is a
# hundred thousand points drawn on top of each other.
#
# What a station gets before anybody has defined a chart.
# 
# These are the Seasons skin's, read out of its [ImageGenerator] with
# `weewx-evo plots import` and written here. Not invented: it is the set
# WeeWX has drawn since 2010, so somebody arriving from WeeWX sees the charts
# they already know, and somebody arriving from nowhere gets a set that fifteen
# years of stations have found sufficient.
# 
# A chart whose readings this station does not have is skipped when the feeds
# run -- the JSON feed says how many. So a soil-moisture chart on a station
# with no probe costs a line in this file and nothing else.
# 
# Copied when the settings page or `serve` finds no plots.toml. Editing this
# file changes nothing on an installation that already has one.
# 
# From weewx-data/skins/Seasons/skin.conf, GPL v3, the WeeWX contributors.

[[plot]]
name = "daybarometer"
span = "day"
time_length = "27h"
show_daynight = true
skip_if_empty = "year"

  [[plot.line]]
  obs = "barometer"
  width = 1.0
  gap_fraction = 0.05

