# Was weewx-evo selbst schreibt, auf Deutsch.
#
# Nicht die Wörter einer Skin: die stehen in deren eigener
# lang/de.conf und gewinnen überall, wo sie etwas sagen. Hier steht,
# was der Kern schreibt, wenn keine Skin dazwischen ist -- die
# Beschriftung in den Diagrammen, die Namen der Mondphasen, die
# Himmelsrichtungen.

name = "Deutsch"

# Die Einheiten, in denen eine Seite ohne andere Angabe gelesen wird.
# Wer Deutsch liest, will fast sicher Millimeter.
unit_system = "METRICWX"

# Wie ein Datum hier geschrieben wird. `%x` und `%X` beantwortet strftime
# sonst aus der Locale des Prozesses -- und im Image ist keine gesetzt,
# also käme "08/27/26" auf einer deutschen Seite heraus.
[formats]
date = "%d.%m.%Y"
time = "%H:%M:%S"
datetime = "%d.%m.%Y %H:%M"

[obs]
outTemp = "Außentemperatur"
inTemp = "Innentemperatur"
dewpoint = "Taupunkt"
inDewpoint = "Taupunkt innen"
outHumidity = "Luftfeuchte"
inHumidity = "Luftfeuchte innen"
barometer = "Luftdruck"
pressure = "Stationsdruck"
altimeter = "Höhenmesser"
barometerRate = "Luftdruckänderung"
windSpeed = "Windgeschwindigkeit"
windDir = "Windrichtung"
windGust = "Böen"
windGustDir = "Böenrichtung"
wind = "Wind"
windvec = "Windvektor"
windgustvec = "Böenvektor"
windchill = "Windchill"
windrun = "Windweg"
heatindex = "Hitzeindex"
appTemp = "Gefühlte Temperatur"
humidex = "Humidex"
rain = "Regen"
rainRate = "Regenrate"
hail = "Hagel"
hailRate = "Hagelrate"
snow = "Schnee"
snowRate = "Schneerate"
snowDepth = "Schneehöhe"
radiation = "Sonnenstrahlung"
maxSolarRad = "Klarhimmel-Strahlung"
UV = "UV-Index"
ET = "Verdunstung"
cloudbase = "Wolkenuntergrenze"
heatdeg = "Heizgradtage"
cooldeg = "Kühlgradtage"
growdeg = "Wachstumsgradtage"
lightning_distance = "Blitzentfernung"
lightning_strike_count = "Blitzeinschläge"
rxCheckPercent = "Signalqualität"
consBatteryVoltage = "Konsolenbatterie"
supplyVoltage = "Versorgungsspannung"
referenceVoltage = "Referenzspannung"
heatingVoltage = "Heizungsspannung"
txBatteryStatus = "Senderbatterie"
windBatteryStatus = "Windsensor-Batterie"
rainBatteryStatus = "Regensensor-Batterie"
outTempBatteryStatus = "Außensensor-Batterie"
inTempBatteryStatus = "Innensensor-Batterie"
pm1_0 = "PM1,0"
pm2_5 = "PM2,5"
pm10_0 = "PM10"

# Messwerte, die es in Familien gibt. Die Nummer hängt der Kern an.
[obs.numbered]
extraTemp = "Temperatur"
extraHumid = "Luftfeuchte"
leafTemp = "Blatttemperatur"
leafWet = "Blattnässe"
soilTemp = "Bodentemperatur"
soilMoist = "Bodenfeuchte"
batteryStatus = "Batterie"
signal = "Signal"

[moon]
# Die acht Phasen, in der Reihenfolge des Zyklus.
phases = ["Neumond", "zunehmende Sichel", "erstes Viertel",
          "zunehmender Mond", "Vollmond", "abnehmender Mond",
          "letztes Viertel", "abnehmende Sichel"]

[compass]
# Sechzehn Punkte, dann das Wort für "gar kein Wind".
directions = ["N", "NNO", "NO", "ONO", "O", "OSO", "SO", "SSO",
              "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW",
              "k. A."]
north = "N"

[months]
# Für die Zeitachse eines Diagramms. Nicht über strftime, weil das
# der Locale des Prozesses folgt und nicht dieser Einstellung: in
# einem Container ohne gesetzte Locale kommt "May" statt "Mai".
short = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun",
         "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"]
long = ["Januar", "Februar", "März", "April", "Mai", "Juni",
        "Juli", "August", "September", "Oktober", "November",
        "Dezember"]

[days]
short = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"]
long = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag",
        "Samstag", "Sonntag"]

# Was der Himmel macht, nach WMO-Code. Der Schlüssel ist die Zahl,
# weil die Zahl das ist, was die Quelle schickt -- eine Übersetzung,
# die am englischen Wortlaut hängt, bricht sobald jemand
# "Light rain showers" umformuliert.
[weather]
0 = "Klarer Himmel"
1 = "Überwiegend klar"
2 = "Teilweise bewölkt"
3 = "Bedeckt"
45 = "Nebel"
48 = "Gefrierender Nebel"
51 = "Leichter Nieselregen"
53 = "Nieselregen"
55 = "Starker Nieselregen"
56 = "Leichter gefrierender Nieselregen"
57 = "Gefrierender Nieselregen"
61 = "Leichter Regen"
63 = "Regen"
65 = "Starker Regen"
66 = "Leichter gefrierender Regen"
67 = "Gefrierender Regen"
71 = "Leichter Schneefall"
73 = "Schneefall"
75 = "Starker Schneefall"
77 = "Schneegriesel"
80 = "Leichte Regenschauer"
81 = "Regenschauer"
82 = "Heftige Regenschauer"
85 = "Leichte Schneeschauer"
86 = "Schneeschauer"
95 = "Gewitter"
96 = "Gewitter mit leichtem Hagel"
99 = "Gewitter mit Hagel"

# Die Wörter, die in einer Einheit stecken. Nur die, die anders
# heißen -- "°C" ist überall "°C".
[units]
day = [" Tag", " Tage"]
hour = [" Stunde", " Stunden"]
minute = [" Minute", " Minuten"]
second = [" Sekunde", " Sekunden"]
meter = " m"
foot = " Fuß"
mile_per_hour = " mph"
degree_C_day = " °C-Tag"
degree_F_day = " °F-Tag"

# Die Wörter einer Übersichtsseite -- die vier Dashboards, die beiden
# Auswahlfelder und die Handvoll Begriffe, die einen Titel zusammenhalten.
# Alles andere steht schon in [obs]: ein Diagramm heißt nach dem, was es
# zeigt, und das ist oben übersetzt.
#
# Was hier fehlt, bleibt englisch. Eine Datei mit zwölf von zwanzig
# Wörtern zeigt zwölf übersetzt, statt gar nichts.
[dashboard]
weather = "Wetter"
now = "Jetzt"
one_location = "Ein Standort"
compare = "Vergleich"
operations = "Betrieb"
charts = "Diagramme"

day = "Tag"
week = "Woche"
month = "Monat"
year = "Jahr"

location = "Standort"
reading = "Messwert"

today = "heute"
last_seen = "Zuletzt gehört"
indoors = "Innen, Batterien und Signal"
every_location = "alle Standorte"
sun = "Sonne"

about_compare = "Alle Standorte auf einer Achse. Der Messwert wird oben gewählt; die Legende nennt die Stationen."
about_last_seen = "Wie lange es her ist, dass ein Standort zuletzt etwas geschrieben hat. Ein Archivintervall sind fünf Minuten, eine Viertelstunde also drei verpasste."
about_interval = "Jeder Mittelwert ist damit gewichtet. Eine Stufe hier ist die Stelle, an der ein ungewichteter Mittelwert von den Seiten der Station abzuweichen beginnt."
about_battery = "Ein Wert über null heißt bei den meisten Konsolen: Batterie wechseln."

forecast = "Vorhersage"
the_week = "Die nächsten Tage"
the_hours = "Die nächsten Stunden"
sky = "Himmel"
high = "Höchst"
low = "Tiefst"
chance = "Wahrsch."
expected = "erwartet"
about_forecast = "Was eine Vorhersagequelle erwartet, neben dem, was die Station gemessen hat. Beide treffen sich bei jetzt."
about_week = "Aus der Tageszusammenfassung der Quelle, nicht aus den Stunden gerechnet: ein Maximum zwischen zwei Stundenwerten steht in der ersten und nicht in den zweiten."
generated = "Erzeugt von `weewx-evo grafana provision` am {when}. Änderungen hier werden beim nächsten Lauf überschrieben; die Diagramme ändert man in `plots.toml` oder auf der Einstellungsseite."

[chart]
# The sentence under a chart that draws several places: which aggregate, in
# which unit, of which places, and what was left out and why. Composed in
# `chartdata.py` rather than in the browser, for the same reason the title and
# the labels are -- a published chart file has to say what is in it, and
# nothing on the far end has another source for it.
#
# `other_unit` carries a `{unit}` placeholder, substituted with `str.replace`
# and not with `format`: a translator who writes a brace in a sentence would
# otherwise get an exception about a field nobody asked for.
records = "Messwerte"
avg = "Mittel"
min = "Minimum"
max = "Maximum"
sum = "Summe"
count = "Anzahl"
not_configured = "ist nicht eingerichtet"
no_column = "zeichnet das nicht auf"
other_unit = "misst in {unit}, dieses Diagramm ist in {chart}"
no_unit = "gibt dafür keine Einheit an, dieses Diagramm ist in {chart}"
