# Was die Treiber über ihre eigene Hardware sagen.
"GW1000, GW1100, GW1200, GW2000, GW3000, HP2551, HP2561, WS3800, WS3900, WS3910, WN1980 and their relatives" = "GW1000, GW1100, GW1200, GW2000, GW3000, HP2551, HP2561, WS3800, WS3900, WS3910, WN1980 und ihre Verwandten"
"Fine Offset Observer and its rebadges (Ambient WS-1000 series, Sainlogic, Misol), any Ecowitt console set to protocol Wunderground, Meteobridge, and weather software generally" = "Fine Offset Observer und seine Umetikettierungen (Ambient WS-1000-Reihe, Sainlogic, Misol), jede Ecowitt-Konsole mit Protokoll Wunderground, Meteobridge und Wettersoftware allgemein"
"WS-2902, WS-5000, WS-1965 and the rest of the Ambient range with 'Custom' upload in the awnet app" = "WS-2902, WS-5000, WS-1965 und der Rest der Ambient-Reihe mit 'Custom'-Upload in der awnet-App"
"Tempest, and the AIR, SKY and hub that came before it" = "Tempest, und die AIR, SKY und der Hub davor"
"smartHUB and Access bridges, with a 5-in-1, towers, Pro sensors and the 899 rain gauge" = "smartHUB- und Access-Bridges, mit 5-in-1, Türmen, Pro-Sensoren und dem Regenmesser 899"
"LW301 and LW302 gateways, with the wind, rain, UV and T/H sensors" = "LW301- und LW302-Gateways, mit den Wind-, Regen-, UV- und T/H-Sensoren"
"A driver you run yourself, wherever the hardware is. Anything that can post JSON, in any language." = "Ein Treiber, den du selbst betreibst, dort wo die Hardware ist. Alles, was JSON schicken kann, in jeder Sprache."
"Once it is pointed here it no longer reaches its own servers." = "Sobald sie hierher zeigt, erreicht sie ihre eigenen Server nicht mehr."
"Once it is pointed here it no longer reaches Chaney, so the app and the website stop showing the station." = "Sobald sie hierher zeigt, erreicht sie Chaney nicht mehr, also zeigen App und Website die Station nicht mehr an."
"This one arrives over UDP rather than HTTP, so the listener has to be told to open a second socket: set UDP port to 50222 under Listener and restart. A datagram carries no path, so that port is the whole of the access control -- the upload token cannot reach it." = "Das kommt über UDP statt HTTP, also muss dem Empfänger gesagt werden, dass er einen zweiten Socket öffnet: UDP-Port unter Empfänger auf 50222 setzen und neu starten. Ein Datagramm trägt keinen Pfad, also ist dieser Port die ganze Zugangskontrolle -- das Upload-Token erreicht ihn nicht."
"The hub and this machine have to be on the same network segment. A broadcast does not cross a router." = "Der Hub und diese Maschine müssen im selben Netzsegment liegen. Ein Broadcast kommt nicht über einen Router."
"Nothing to set on the hub. It broadcasts whether or not anybody listens." = "Am Hub ist nichts einzustellen. Er sendet, ob jemand zuhört oder nicht."
"A bridge cannot be told where to post. It goes to Chaney's servers, over plain HTTP on port 80, and there is no setting for it." = "Einer Bridge kann man nicht sagen, wohin sie senden soll. Sie geht über einfaches HTTP auf Port 80 zu den Servern von Chaney, und dafür gibt es keine Einstellung."
"So hubapi.myacurite.com has to resolve to %(address)s on your network. With dnsmasq:" = "Also muss hubapi.myacurite.com in deinem Netz auf %(address)s auflösen. Mit dnsmasq:"
"A gateway cannot be told where to post, so box.weatherdirect.com has to resolve to %(address)s on your network. With dnsmasq:" = "Einem Gateway kann man nicht sagen, wohin es senden soll, also muss box.weatherdirect.com in deinem Netz auf %(address)s auflösen. Mit dnsmasq:"
"Most routers can do the same under a name like 'local DNS'. A hosts file on this machine will not do: the entry has to be seen by the bridge." = "Die meisten Router können dasselbe unter einem Namen wie 'lokales DNS'. Eine hosts-Datei auf dieser Maschine reicht nicht: der Eintrag muss von der Bridge gesehen werden."
"It posts to port 80, so redirect that:" = "Sie sendet auf Port 80, also leite den um:"
"It posts to port 80, so redirect that rather than running this as root:" = "Sie sendet auf Port 80, also leite den um, statt das hier als root laufen zu lassen:"

# Was die Ziele, Dienste und Kanäle sind.
"local directory" = "lokales Verzeichnis"
"A directory on this machine. The built-in web server serves it, so a feed is readable on the local network with nothing else installed." = "Ein Verzeichnis auf dieser Maschine. Der eingebaute Webserver liefert es aus, also ist ein Feed im Heimnetz lesbar, ohne dass sonst etwas installiert wird."
"A web host over FTP. What shared hosting gives you, and the reason the record of what was already sent has to exist." = "Ein Webspace über FTP. Was Shared Hosting hergibt, und der Grund, warum es die Merkliste des schon Gesendeten geben muss."
"A machine reachable over SSH. rsync works out what changed itself, which makes it the cheapest destination over a slow line." = "Eine über SSH erreichbare Maschine. rsync findet selbst heraus, was sich geändert hat, und ist damit über eine langsame Leitung das billigste Ziel."
"The largest network of personal weather stations. Free, and what most people mean by publishing their readings." = "Das größte Netz privater Wetterstationen. Kostenlos, und das, was die meisten mit dem Veröffentlichen ihrer Messwerte meinen."
"A second network, same protocol. Costs nothing and takes the readings a station is already sending elsewhere." = "Ein zweites Netz, dasselbe Protokoll. Kostet nichts und nimmt die Messwerte, die eine Station ohnehin schon woandershin schickt."
"The Citizen Weather Observer Program. Feeds NOAA's MADIS, so the readings reach the same place the airports do." = "Das Citizen Weather Observer Program. Speist NOAAs MADIS, also landen die Messwerte dort, wo auch die Flughäfen landen."
"What people sailing and flying look at. Metric, JSON, and the one service here that is not the Ambient protocol." = "Worauf Segler und Flieger schauen. Metrisch, JSON, und der einzige Dienst hier, der nicht das Ambient-Protokoll spricht."
"The UK Met Office's observations site. Takes stations from anywhere, not only the UK." = "Die Beobachtungsseite des britischen Met Office. Nimmt Stationen von überall, nicht nur aus dem Vereinigten Königreich."
"A map and a dashboard, popular in Europe. Metric, and every reading goes as an integer in tenths." = "Eine Karte und ein Dashboard, in Europa verbreitet. Metrisch, und jeder Messwert geht als ganze Zahl in Zehnteln."
"The archive in a time series database, so Grafana can ask it questions. One upload per archive." = "Das Archiv in einer Zeitreihendatenbank, damit Grafana es fragen kann. Ein Upload je Archiv."
"A broker, so a skin updates while somebody is looking at it. What Belchertown, jas and weewx-wdc take their live data from." = "Ein Broker, damit eine Skin sich aktualisiert, während jemand sie ansieht. Woher Belchertown, jas und weewx-wdc ihre Live-Daten nehmen."
"A message to an address. Needs an SMTP server, which is usually the one that already sends this machine's mail." = "Eine Nachricht an eine Adresse. Braucht einen SMTP-Server, meist denselben, der schon die Mail dieser Maschine verschickt."
"One POST. Covers ntfy, Gotify, Slack, Discord, Telegram and anything else that takes a message over HTTP." = "Ein POST. Deckt ntfy, Gotify, Slack, Discord, Telegram und alles ab, was eine Nachricht über HTTP nimmt."
"Publishes to a broker, retained, one topic per symptom. For an installation that already has Home Assistant or Node-RED." = "Veröffentlicht an einen Broker, retained, ein Topic je Symptom. Für eine Anlage, die schon Home Assistant oder Node-RED hat."
"A forecast for anywhere, without an account. Picks the best model for the location by itself -- the right answer for almost every station." = "Eine Vorhersage für überall, ohne Konto. Wählt selbst das beste Modell für den Ort -- die richtige Antwort für fast jede Station."
"Germany's own station forecast: ICON corrected for a specific place, which is what German weather pages show." = "Die deutsche Stationsvorhersage: ICON, auf einen bestimmten Ort korrigiert, und das, was deutsche Wetterseiten zeigen."
"Germany's official warnings, with the DWD's own wording and description -- which MeteoAlarm translates away." = "Die amtlichen deutschen Warnungen, im Wortlaut und in der Beschreibung des DWD -- die MeteoAlarm wegübersetzt."
"Official weather warnings for 38 European countries, from the aggregator EUMETNET runs. No account needed." = "Amtliche Wetterwarnungen für 38 europäische Länder, vom Aggregator, den EUMETNET betreibt. Kein Konto nötig."
"The United States: official alerts, and a forecast, with no account. The alerts are what it is best at." = "Die Vereinigten Staaten: amtliche Warnungen und eine Vorhersage, ohne Konto. Am besten ist es bei den Warnungen."
"A WeeWX driver, running in its own process" = "Ein WeeWX-Treiber, in einem eigenen Prozess"
"Any of the hundred-odd drivers written for WeeWX, unchanged -- a serial console, one on the USB bus, a radio. WeeWX itself does not have to be installed: point at the driver file and what it imports is stood in for." = "Jeder der gut hundert für WeeWX geschriebenen Treiber, unverändert -- eine serielle Konsole, eine am USB-Bus, ein Funkempfänger. WeeWX selbst muss nicht installiert sein: zeig auf die Treiberdatei, und was sie importiert, wird ersetzt."
"A broker to subscribe to, in its own process" = "Ein Broker zum Abonnieren, in einem eigenen Prozess"
"Readings a broker already carries, from a console that publishes them itself or from a home-automation system. The command weewx-evo mqtt check prints what a broker publishes, which is how the topic names its page asks for are found." = "Messwerte, die ein Broker schon führt, von einer Konsole, die sie selbst veröffentlicht, oder aus einer Hausautomation. Das Kommando weewx-evo mqtt check druckt, was ein Broker veröffentlicht, und so findet man die Topic-Namen, nach denen seine Seite fragt."
