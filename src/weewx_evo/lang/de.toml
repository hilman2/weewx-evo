# Was weewx-evo selbst schreibt, auf Deutsch.
#
# Nicht die Wörter einer Skin: die stehen in deren eigener
# lang/de.conf und gewinnen überall, wo sie etwas sagen. Hier steht,
# was der Kern schreibt, wenn keine Skin dazwischen ist -- die
# Beschriftung in den Diagrammen, die Namen der Mondphasen, die
# Himmelsrichtungen.

name = "Deutsch"

# Die Einheiten, in denen eine Seite ohne andere Angabe gelesen wird.
# Wer Deutsch liest, will fast sicher Millimeter.
unit_system = "METRICWX"

# Wie ein Datum hier geschrieben wird. `%x` und `%X` beantwortet strftime
# sonst aus der Locale des Prozesses -- und im Image ist keine gesetzt,
# also käme "08/27/26" auf einer deutschen Seite heraus.
[formats]
date = "%d.%m.%Y"
time = "%H:%M:%S"
datetime = "%d.%m.%Y %H:%M"

[obs]
outTemp = "Außentemperatur"
inTemp = "Innentemperatur"
dewpoint = "Taupunkt"
inDewpoint = "Taupunkt innen"
outHumidity = "Luftfeuchte"
inHumidity = "Luftfeuchte innen"
barometer = "Luftdruck"
pressure = "Stationsdruck"
altimeter = "Höhenmesser"
barometerRate = "Luftdruckänderung"
windSpeed = "Windgeschwindigkeit"
windDir = "Windrichtung"
windGust = "Böen"
windGustDir = "Böenrichtung"
wind = "Wind"
windvec = "Windvektor"
windgustvec = "Böenvektor"
windchill = "Windchill"
windrun = "Windweg"
heatindex = "Hitzeindex"
appTemp = "Gefühlte Temperatur"
humidex = "Humidex"
rain = "Regen"
rainRate = "Regenrate"
hail = "Hagel"
hailRate = "Hagelrate"
snow = "Schnee"
snowRate = "Schneerate"
snowDepth = "Schneehöhe"
radiation = "Sonnenstrahlung"
maxSolarRad = "Klarhimmel-Strahlung"
UV = "UV-Index"
ET = "Verdunstung"
cloudbase = "Wolkenuntergrenze"
heatdeg = "Heizgradtage"
cooldeg = "Kühlgradtage"
growdeg = "Wachstumsgradtage"
lightning_distance = "Blitzentfernung"
lightning_strike_count = "Blitzeinschläge"
rxCheckPercent = "Signalqualität"
consBatteryVoltage = "Konsolenbatterie"
supplyVoltage = "Versorgungsspannung"
referenceVoltage = "Referenzspannung"
heatingVoltage = "Heizungsspannung"
txBatteryStatus = "Senderbatterie"
windBatteryStatus = "Windsensor-Batterie"
rainBatteryStatus = "Regensensor-Batterie"
outTempBatteryStatus = "Außensensor-Batterie"
inTempBatteryStatus = "Innensensor-Batterie"
pm1_0 = "PM1,0"
pm2_5 = "PM2,5"
pm10_0 = "PM10"

# Messwerte, die es in Familien gibt. Die Nummer hängt der Kern an.
[obs.numbered]
extraTemp = "Temperatur"
extraHumid = "Luftfeuchte"
leafTemp = "Blatttemperatur"
leafWet = "Blattnässe"
soilTemp = "Bodentemperatur"
soilMoist = "Bodenfeuchte"
batteryStatus = "Batterie"
signal = "Signal"

[moon]
# Die acht Phasen, in der Reihenfolge des Zyklus.
phases = ["Neumond", "zunehmende Sichel", "erstes Viertel",
          "zunehmender Mond", "Vollmond", "abnehmender Mond",
          "letztes Viertel", "abnehmende Sichel"]

[compass]
# Sechzehn Punkte, dann das Wort für "gar kein Wind".
directions = ["N", "NNO", "NO", "ONO", "O", "OSO", "SO", "SSO",
              "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW",
              "k. A."]
north = "N"

[months]
# Für die Zeitachse eines Diagramms. Nicht über strftime, weil das
# der Locale des Prozesses folgt und nicht dieser Einstellung: in
# einem Container ohne gesetzte Locale kommt "May" statt "Mai".
short = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun",
         "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"]
long = ["Januar", "Februar", "März", "April", "Mai", "Juni",
        "Juli", "August", "September", "Oktober", "November",
        "Dezember"]

[days]
short = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"]
long = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag",
        "Samstag", "Sonntag"]

# Was der Himmel macht, nach WMO-Code. Der Schlüssel ist die Zahl,
# weil die Zahl das ist, was die Quelle schickt -- eine Übersetzung,
# die am englischen Wortlaut hängt, bricht sobald jemand
# "Light rain showers" umformuliert.
