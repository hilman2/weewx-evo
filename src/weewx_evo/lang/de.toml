# Die Einstellungen selbst, auf ihren eigenen Namen geschlüsselt und nicht auf
# ihren englischen Wortlaut: `help` ist mehrere Sätze lang und ein Absatz ist
# ein schlechter Schlüssel. Der Name steht ohnehin fest -- so heißt die Option
# in der Konfigurationsdatei, und ihn umzubenennen ist eine Migration, ob hier
# etwas übersetzt ist oder nicht.
#
# Fehlt ein `help`, druckt die Seite den englischen: leer heißt "diese Sprache
# sagt dazu nichts", nicht "hier steht nichts".
[settings.language]
label = "Sprache"
help = "Worin alles geschrieben ist: die Beschriftung der Diagramme, die Namen der Mondphasen, die Himmelsrichtungen und jede übersetzte Skin. Eine Einstellung, weil eine Station von den Leuten in ihrer Nähe gelesen wird und die eine Sprache lesen. Ein Feed lässt sich auf seiner eigenen Seite trotzdem auf eine andere stellen, für eine zweimal veröffentlichte Site."

[settings.interval]
label = "Archivintervall"
help = "Wie viel Zeit ein Archivsatz abdeckt. Fünf Minuten sind die übliche Wahl. Eine Änderung stört nichts, was schon aufgezeichnet ist -- jeder Satz trägt die Spanne, für die er steht, also mitteln alte und neue korrekt zusammen."

[settings.grace]
label = "Nachlaufzeit"
help = "Wie lange nach dem Ende eines Intervalls gewartet wird, bevor es gerechnet wird, damit ein bloß langsames Paket den Satz nicht ein zweites Mal erzwingt."

[settings.loop_hilo]
label = "Extremwerte aus den Paketen schärfen"
help = "Einzelne Pakete dürfen die Tagesextreme setzen, nicht nur die Archivsätze. Standardmäßig an, wie bei WeeWX. Ausgeschaltet sind die Tageshöchst- und -tiefstwerte allein aus dem Archiv exakt reproduzierbar."

[settings.feeds_dir]
label = "Ausgabe der Feeds"
help = "Wohin die Feeds schreiben. Jeder bekommt ein Verzeichnis darunter. Das ist ihr Arbeitsverzeichnis, kein veröffentlichtes: erst ein Export bringt die Dateien dorthin, wo sie jemand lesen kann."

[settings.plots_file]
label = "Diagrammdefinitionen"
help = "Welche Diagramme es gibt, und was in jedem steht. Eine eigene Datei statt eines Abschnitts hier: es ist eine Liste vieler gleichartiger Sätze, und einen aus einer alten Skin importierten will man diffen können."

[settings.live_db]
label = "Live-Datenbank"
help = "Wo Pakete liegen, bis sie zu Sätzen verarbeitet sind. Eine eigene Datei, damit ihre Größe und ihre Aufbewahrung nichts mit dem Archiv zu tun haben."

[settings.retention]
label = "Pakete aufbewahren für"
help = "Wie lange rohe Pakete bleiben. Sie sind es, was einen Satz reproduzierbar macht: solange sie hier sind, lässt sich eine falsche Kalibrierung oder ein spätes Paket korrigieren. Sieben Tage sind bei einem Paket alle acht Sekunden rund 80 MB."

[settings.raw_retention]
label = "Rohe Uploads aufbewahren für"
help = "Wie lange der Upload so, wie er vom Draht kam, neben den Messwerten bleibt. Wofür er da ist, ist das, was der Treiber gar nicht lesen konnte: die Messwerte zeigen, was er verstanden hat, also fehlt genau das darin. Wohin ein Messwert geht, hängt hiervon nicht ab -- die Namen, die die Konsole benutzt hat, bleiben die volle Aufbewahrungszeit. 0 behält sie nicht."

[settings.spool]
label = "Pakete vor dem Verwerfen herausschreiben"
help = "Ein Verzeichnis. Jeder Tag Pakete, der die Live-Tabelle verlässt, wird dort zuerst als gzip-NDJSON abgelegt. Leer heißt, sie werden einfach verworfen."

[settings.host]
label = "Lauschen auf"
help = "0.0.0.0 sind alle Schnittstellen. Enger setzen, wenn die Maschine in mehr als einem Netz hängt."

[settings.port]
label = "Port"
help = "Ports unter 1024 brauchen root, was dieser Prozess nicht haben sollte."

[settings.reachable_at]
label = "Adresse, unter der Konsolen ihn erreichen"
help = "Wohin die Hardware ihre Uploads schickt, wenn das nicht schlicht diese Maschine auf diesem Port ist. Hinter einem Reverse Proxy oder in einem Container mit veröffentlichtem Port ist es das nicht: der Empfänger bindet eine Adresse und der Konsole muss eine andere gesagt werden, und nichts in diesem Prozess kann ausrechnen welche. Leer heißt raten, was im Heimnetz richtig ist. Schema und Port optional -- https://wetter.example.org:8443 ist eine ganze Antwort, wetter.example.org auch."

[settings.token]
label = "Upload-Token"
help = "Ein Pfadsegment, das jeder Upload tragen muss. Es ist das Einzige zwischen dem offenen Internet und der Messreihe: Hardware kann keinen Header senden, also ist ein nicht erratbarer Pfad die praktikable Antwort. Wer es erfährt, kann Messwerte fälschen."

[settings.driver]
label = "Standardtreiber"
help = "Welcher Treiber einen Upload liest, dessen Pfad keinen nennt. Eine Konsole, die sich nur auf einen nackten Pfad richten lässt, braucht das hier richtig. Die Liste ist, was installiert ist -- mehr mit 'weewx-evo driver install'."

[settings.udp_port]
label = "UDP-Port"
help = "Für Hardware, die sendet statt zu posten. 0 schaltet es ab. Ein Datagramm trägt keinen Pfad, also ist der Port selbst die Zugangskontrolle."

[settings.infer_unknown]
label = "Felder, die der Katalog nicht kennt"
help = "Hardware liefert Sensoren schneller aus, als ein Katalog nachkommt. 'series' ist der vernünftige Default: ein Kanal, den die Hardware dazubekommt, braucht keine neue Version, und was bloß an seinem Namen erkennbar ist, wird aufgelistet statt geraten. Das ist eine Politik und keine Eigenschaft eines Protokolls, also wird es einmal gefragt und jeder Treiber bekommt es. Verloren geht so oder so nichts: der Messwert wird unter dem Namen gespeichert, den die Konsole benutzt hat, und was hier entschieden wird, ist nur, ob eine Vermutung für dich aufgeschrieben oder dir überlassen wird."

[settings.max_behind]
label = "Zeitstempel annehmen bis zu diesem Alter"
help = "Eine Konsole im Internet hält ihre Uhr per NTP, also heißt ein paar Minuten alter Stempel eher verzögerter Upload als falsche Uhr. Darüber hinaus wird die Ankunftszeit benutzt. Eine Konsole mit wirklich schlechter Uhr bekommt ihren eigenen Wert auf der Senderseite."

[settings.max_ahead]
label = "Und so weit in die Zukunft"
help = "Es gibt keinen Messwert aus der Zukunft, also deckt das nur die Abweichung zwischen zwei Uhren ab, die beide ungefähr richtig gehen."

[settings.allow]
label = "Antworten"
help = "'private' ist das lokale Netz -- der Schuppen, die Konsole, der Laptop in der Küche -- und deckt einen Reverse Proxy ab, der immer von einer privaten Adresse kommt. 'any' schließt das offene Internet ein. Oder Netze auflisten: 10.0.0.0/8, 192.168.1.50. Loopback wird immer beantwortet."

[settings.rate]
label = "Anfragen je Sekunde und Adresse"
help = "Eine Konsole sendet im schnellsten Fall eine halbe Anfrage je Sekunde, das hier fängt also nur etwas ab, das schiefgegangen ist. Was das Erraten des Tokens stoppt, ist die getrennte Grenze für falsche. 0 schaltet es ab."

[settings.behind_proxy]
label = "Hinter einem Reverse Proxy"
help = "Dann kommt jede Anfrage von der Adresse des Proxys, und je Adresse zu begrenzen bremste alle außer dem, der es tut. Das Rate-Limit bleibt dem Proxy überlassen, der als Einziges dazu in der Lage ist."

[settings."admin.token"]
label = "Admin-Token"
help = "Nie dasselbe wie das Upload-Token. Sonst könnte alles, was einen Messwert senden kann, auch ändern, was die Station aufzeichnet. Leer schaltet die Seite ab."

[settings."admin.port"]
label = "Port"

[settings."admin.host"]
label = "Lauschen auf"

[settings."admin.allow"]
label = "Antworten"
help = "Wie oben, und es lohnt sich, es enger zu halten. Diese Seite richtet das Archiv auf Dateien. Um sie von woanders zu erreichen, ohne sie zu öffnen: ssh -L 8080:localhost:8080 die-station"

[settings."admin.rate"]
label = "Anfragen je Sekunde und Adresse"
help = "Speichern sind zwei Anfragen, und wer durch die Reiter klickt, macht mehrere je Sekunde. Eine Grenze, die im Weg steht, ist eine, die abgeschaltet wird."

[settings.table]
label = "Archivtabelle"
help = "Die Tabelle in der Datenbank. Nur für eine Installation zu ändern, die sie umbenannt hat."

[settings.poll]
label = "Auf geschlossene Intervalle prüfen alle"
help = "Wie oft der Archiver nachsieht. Die Arbeit ist idempotent und die Intervallgrenzen kommen aus den Paketen, also ändert ein später oder ausgelassener Takt nichts."

[settings.driver_dir]
label = "Fremdtreiber"
help = "Wo Treiber liegen, die mit 'weewx-evo driver install' installiert wurden. Leer heißt neben dem Archiv."

[settings.weewx_conf]
label = "Auf diese weewx.conf zurückfallen"
help = "Einstellungen, die beide Systeme teilen -- Breite, Höhe, das Archivintervall -- dürfen dort weiterleben. Gelesen, nie geschrieben. Was hier gesetzt ist, gewinnt."

[settings.watchdog]
label = "Neu starten, wenn dieser Prozess krank wird"
help = "Wacht über ein Deskriptorleck, einen gestorbenen Runner-Thread und eine stehengebliebene Archiver-Schleife -- die Dinge, die ein frischer Prozess behebt. Er beendet sich, der Supervisor startet ihn wieder. Braucht 'restart: unless-stopped' in Compose oder 'Restart=always' in einer Unit-Datei, was die mitgelieferten haben."

[settings.watchdog_cooldown]
label = "und danach nicht wieder für"
help = "Der Mindestabstand zwischen zwei Selbstneustarts. Er steht in der Live-Datenbank und überlebt damit den Neustart, den er begrenzt. Darunter wird das Symptom bei jedem Durchgang protokolliert und sonst nichts getan."

[settings."web.enabled"]
label = "Die Seiten ausliefern"
help = "Aus wird nichts ausgeliefert und die Exporte veröffentlichen trotzdem. An ist alles, was ein lokaler Export geschrieben hat, unter den Adressen darunter erreichbar."

[settings."api.enabled"]
label = "Fragen zu den Daten beantworten"
help = "Eine Adresse, unter der ein Skript, Home Assistant oder ein Dashboard nach einem Messwert über eine Zeitspanne fragen kann statt nach einer Datei, die vorher jemand gemacht hat. Nur lesend, auf demselben Port wie die Seiten, unter /api/v1/."

[settings."api.token"]
label = "Dieses Token verlangen"
help = "Leer heißt, jeder, dem die Seiten ausgeliefert werden, darf fragen. Setze eines, wenn die Seiten im offenen Internet stehen: die API antwortet über jede Zeitspanne und nicht nur über das, was ein Feed veröffentlicht hat."

[settings."metrics.enabled"]
label = "Veröffentlichen, was der Prozess tut"
help = "Ein /metrics-Endpunkt für Prometheus: Deskriptoren, Threads, wie lange jede Station her ist, ob die Exporte laufen. Das Wetter steht nicht darin -- dafür sind das Archiv und Grafana da."

[settings."web.port"]
label = "Port"
help = "Ein eigener, getrennt vom Upload-Port und von der Einstellungsseite. Die beiden antworten Hardware und einem Betreiber; dieser antwortet Browsern."

[settings."web.default"]
label = "Das unter / zeigen"
help = "Was unter der Adresse selbst erscheint. Mit einer Wahl ist / diese, und der Rest bleibt unter /<name>/. Ohne listet / sie auf."

[settings."web.allow"]
label = "Antworten"
help = "Eine Wetterseite ist kein Geheimnis, aber es ist trotzdem diese Maschine, die Fremden antwortet. Hinter einem Reverse Proxy so lassen: der Proxy verbindet von Loopback, und das ist privat."

[settings."web.host"]
label = "Lauschen auf"
help = "An alles gebunden und antwortet nur privaten Netzen. Was es privat hält, ist die Zeile darüber, nicht diese."

# Was jeder Feed und jeder Export gemeinsam hat.
[settings.trigger]
label = "Erzeugen"
help = "Mit dem Archiv ist richtig für alles, was aus Archivsätzen gebaut wird: vor dem nächsten Satz gibt es nichts Neues zu zeichnen. Ein eigener Takt ist für das, was den Sätzen nicht folgt -- eine nächtliche Zusammenfassung, oder teure Diagramme auf einer Maschine, die sie nicht alle fünf Minuten neu zeichnen soll."

[settings.every]
label = "Wie oft"
help = "Gilt nur, wenn es auf eigenem Takt läuft. Auf die Uhr gerundet, damit ein stündlicher Feed zur vollen Stunde erzeugt und nicht eine Stunde nach dem Start des Dienstes."

[settings.archive]
label = "Ort"
help = "Der Ort, um den es auf diesen Seiten geht. Bei einem Ort gibt es nichts zu wählen. Bei zweien ist es der, dessen Heute, dessen Woche und dessen Rekorde die Seiten drucken -- und er ist immer der erste der Orte unter „Auch zeigen“ darunter, ob er dort genannt ist oder nicht."

[settings.enabled]
label = "Das JSON erzeugen"
help = "Nur aus, wenn es niemand liest. Jeder andere Feed, der ein Diagramm zeichnet, tut es."

[settings.destination]
label = "Verzeichnis"
help = "Unter dem Ausgabeverzeichnis des Feeds. Ein Unterverzeichnis statt der obersten Ebene, damit die Daten nicht zwischen den Seiten liegen."

[settings.manifest]
label = "index.json schreiben"
help = "Eine Liste dessen, was es gibt, damit ein Client seine Seite aufbauen kann, bevor er etwas holt, und nie nach einem Sensor fragt, den diese Station nicht hat."

[settings.rewrite_unchanged]
label = "Unveränderte Dateien neu schreiben"
help = "Ein Jahr Tagesmittel sagt um zehn nach dasselbe wie um zehn. Aus gelassen wird eine Datei mit gleichen Daten nicht angefasst -- was zählt, wenn ein Export alles Geänderte über eine Leitung schickt, die jemand nach Megabyte bezahlt."

[settings.rounding]
label = "Nachkommastellen"
help = "Drei sind schon feiner als jeder Wettersensor und sparen rund ein Drittel der Dateigröße. Nur für etwas erhöhen, das kein Wetter ist."

[settings.indent]
label = "Die Dateien einrücken"
help = "0 schreibt sie so klein wie möglich, und das will man auf einer laufenden Site. 2 macht sie lesbar, während man herausfindet, warum ein Diagramm falsch aussieht."

[settings.places]
label = "Nur diese Orte"
help = "Einer je Zeile. Leer schreibt für jeden Ort ein Diagrammverzeichnis, und das ist die sichere Seite: ein Verzeichnis, auf das nichts verlinkt, kostet Platz, und eines, auf das eine Seite verlinkt und das fehlt, ist eine kaputte Seite. Nur da einengen, wo eine bezahlte Leitung hundert Dateien je Ort zum Nachdenken macht. Nicht dieselbe Einstellung wie die einer Skin: die sagt, welche Orte eine Site zeigt, diese, welche ein Diagrammverzeichnis abdeckt."

[settings.spans]
label = "Nur diese Gruppen"
help = "Kommagetrennt, passend zur Gruppe, in der ein Diagramm steht. Leer erzeugt alle. Ein Jahresdiagramm über zehn Jahre Sätze ist das teure; es wegzulassen ist der Weg, wie eine kleine Maschine mitkommt."

[settings.units]
label = "Messwerte anzeigen in"
help = "Worin die Dateien geschrieben werden, gleich was im Archiv steht. Eine Konsole, die Fahrenheit meldet, und eine Site in Celsius ist der Normalfall: das Archiv behält, was die Station geschrieben hat, und umgerechnet wird auf dem Weg nach draußen."

[settings."unit.group_temperature"]
label = "Temperatur"
help = "Schlägt das System für diese eine Gruppe. So kommt jemand zu Grad Celsius und Zoll Quecksilbersäule auf einer Seite, weil seine Leser das erwarten."

[settings."unit.group_pressure"]
label = "Druck"

[settings."unit.group_rain"]
label = "Regen"

[settings."unit.group_speed"]
label = "Windgeschwindigkeit"

[settings."unit.group_altitude"]
label = "Höhe"

[settings."unit.group_distance"]
label = "Entfernung"

[settings.twilight]
label = "Dämmerung mitliefern"
help = "Die Dämmerung ist keine Kante: das Licht geht über die halbe Stunde der bürgerlichen Dämmerung, und in hohen Breiten im Sommer über weit längere Zeit. Damit kann ein Diagramm das Echte zeichnen statt einer Stufe. Kostet ein paar hundert Byte je Datei."

[settings.live_from]
label = "Live-Werte nehmen von"
help = "Zählt nur bei mehr als einem MQTT-Upload -- eine Station, die auf einen Broker für Home Assistant und auf einen anderen für ihre Website veröffentlicht. Eine Skin, die ihren eigenen Broker in der skin.conf nennt, behält ihn so oder so."

# Der Cheetah-Feed und die Skin, die er fährt.
[settings.skin]
label = "Skin"
help = "Ein Verzeichnis mit Cheetah-Vorlagen, für WeeWX geschrieben. Richte das Skin-Verzeichnis darunter auf eine vorhandene Installation, und ihre Skins erscheinen hier."

[settings.skins_dir]
label = "Skin-Verzeichnis"
help = "Wo nach Skins gesucht wird. Eine WeeWX-Installation hält sie in `skins`; dieses Verzeichnis lässt sich direkt benutzen."

[settings.charts_path]
label = "Wo die Diagrammdateien liegen"
help = "Die Adresse, unter der ein Browser die Diagrammdateien dieser Station erreicht, also dorthin, wo der `json`-Feed veröffentlicht. Einer Skin, die ihre Diagramme aus diesen Dateien zeichnet, muss man das sagen: sie sind ein eigener Export neben diesen Seiten, womöglich auf einen anderen Host, also kann es hier nichts ausrechnen. Leer lässt stehen, was die Skin sagt, und das ist bei der mitgelieferten `/json/` -- die Stelle, an der der eingebaute Webserver einen lokalen Export namens `json` ausliefert."

[settings.units_other_path]
label = "Adresse derselben Site in anderen Einheiten"
help = "Für eine Station, die zweimal veröffentlicht, einmal je System: ein zweiter Feed derselben Skin mit einem anderen `Messwerte anzeigen in`, in ein eigenes Verzeichnis. Damit bekommen die Seiten einen Umschalter zwischen beiden und merken sich, was jemand gewählt hat. Leer gibt es keinen Umschalter, und das ist richtig für eine Station, die einmal veröffentlicht."

[settings.units_other_label]
label = "Wie diese Einheiten heißen sollen"
help = "Was der Umschalter für die andere Seite sagt. Zwei oder drei Zeichen: er sitzt im Kopf neben dem Hell-Dunkel-Schalter."

[settings.extras]
label = "Die eigenen Einstellungen der Skin"
help = "Ein `name = wert` je Zeile, in die [Extras] der Skin gelegt, über das, was sie selbst sagt. Dort legt der Autor einer Skin ab, was ein Betreiber ändern soll, und wer dafür die Skin editiert, verliert es beim nächsten Update. weewx-wdc braucht hier `base_path = /wdc/`, wenn es irgendwo anders als in der Wurzel einer Site veröffentlicht wird, sonst werden sein Stylesheet und seine Diagramme an der falschen Stelle gesucht."

[settings.lang]
label = "Sprache"
help = "Eine WeeWX-Skin hält ihre Übersetzungen in ihrem eigenen lang-Verzeichnis, und diese Dateien tragen neben den Wörtern auch das Einheitensystem, die Beschriftungen und die Himmelsrichtungen. Die Liste ist das, was die gewählte Skin hat."

[settings.encoding]
label = "Die Seiten schreiben als"
help = "WeeWX' Vorgabe sind HTML-Entities, und die überleben einen Webserver, der nichts über seine Kodierung sagt."

[settings.copy_static]
label = "Stylesheets und Bilder mitkopieren"
help = "Das eigene CSS, die Schriften und die Skripte einer Skin. Nur aus, wenn etwas anderes sie dorthin legt."

[settings.stale_ok]
label = "stale_age einer Vorlage beachten"
help = "Eine Skin markiert Seiten, die nicht jedes Intervall neu geschrieben werden müssen. Aus rendert jedes Mal alles, was langsamer und nie falsch ist."

# Das Deck-Layout.
[settings.layout]
label = "Aufbau"
help = "Der alternative Aufbau legt die aktuellen Werte, die Zeiger und die Diagramme in ein Raster. Der klassische hält die Abschnitte auseinander."

[settings.default_theme]
label = "Farben"
help = "Was ein Besucher sieht, bevor er wählt. Die Seite hat so oder so einen Schalter und merkt sich die Wahl."

[settings.gauges_display]
label = "Zeiger"
help = "Rundinstrumente für die aktuellen Werte."

[settings.gauges_size]
label = "Zeigergröße"

[settings.stat_tile_observations]
label = "Messwerte mit Kachel"
help = "Je eine Kachel, in dieser Reihenfolge. Ein Messwert, den die Datenbank nicht hat, wird weggelassen statt leer gezeigt."

[settings.table_tile_observations]
label = "Messwerte in der Tabelle"

[settings.stat_tiles_show_min]
label = "Minimum zeigen für"
help = "Eine Kachel zeigt voreingestellt das Maximum. Diese zeigen auch das Minimum -- eine Temperatur ist in beide Richtungen interessant, eine Regenrate nicht."

[settings.stat_tiles_show_max]
label = "Nur das Maximum zeigen für"

[settings.stat_tiles_show_sum]
label = "Summe zeigen für"
help = "Regen, Verdunstung, Windweg: die Messwerte, bei denen die Summe die Zahl ist, die etwas bedeutet."

[settings.show_min_max_time_day]
label = "Uhrzeit nennen, auf der Tagesseite"
help = "Wann das Tageshoch und -tief erreicht wurden, unter dem Wert."

[settings.show_min_max_time_yesterday]
label = "Uhrzeit nennen, gestern"

[settings.show_min_max_time_week]
label = "Uhrzeit nennen, auf der Wochenseite"

[settings.show_min_max_time_month]
label = "Uhrzeit nennen, auf der Monatsseite"

[settings.outTemp_stat_tile_color]
label = "Kachel einfärben"

[settings.outTemp_stat_tile_color_min]
label = "Am kältesten"
help = "Die Temperatur, für die die kälteste Farbe steht, in der Einheit, in der die Seiten angezeigt werden."

[settings.outTemp_stat_tile_color_max]
label = "Am wärmsten"

[settings.outTemp_stat_tile_color_transparency]
label = "Stärke"
help = "0 ist gar keine Färbung, 1 die volle Farbe."

[settings.stat_tile_winddir_ordinal]
label = "Himmelsrichtungen auf Kacheln"
help = "NNW statt 337 Grad."

[settings.diagram_tile_winddir_ordinal]
label = "Himmelsrichtungen auf Diagrammen"

[settings.windRose_show_beaufort]
label = "Windrose in Beaufort"
help = "Bänder nach Stärke statt nach Geschwindigkeit."

[settings.windRose_legend_show_units]
label = "Einheiten in der Windrosen-Legende"

[settings.windRose_colors]
label = "Farben der Windrose"
help = "Eine Farbe je Band, das ruhigste zuerst. Voreingestellt sind sechs."

[settings.climatological_days]
label = "Zu zählende Tage"
help = "Benannte Schwellen, je Monat und je Jahr gezählt. Die Schwellen sind die des Deutschen Wetterdienstes: ein Regentag ist 0,1 mm, ein Sommertag 25 °C, ein Sturmtag eine Bö von 8 Beaufort. Sie überschneiden sich absichtlich -- ein Wüstentag ist auch ein heißer Tag -- also gibt es keine Summe, und die letzte Zeile ist, wie viele Tage der Zeitraum hat. Ein Messwert, den diese Station nicht aufzeichnet, wird weggelassen statt als Null gezählt."

[settings.climatological_days_per_month]
label = "Nach Monaten aufschlüsseln"

[settings.climatogram_enable_stats]
label = "Klimadiagramm auf der Jahresseite"

[settings.climatogram_enable_year_stats]
label = "Klimadiagramm auf der Statistikseite"

[settings.show_last_rain]
label = "Wann es zuletzt geregnet hat"

[settings.show_most_days_with_rain]
label = "Längste nasse Strecke"

[settings.show_most_days_without_rain]
label = "Längste trockene Strecke"

[settings.show_most_rain_within_one_day]
label = "Nassester Tag"

[settings.sensor_diagram_period]
label = "Zeitraum"

[settings.sensor_stat_tile_observations]
label = "Messwerte mit Kachel"

[settings.sensor_diagram_observations]
label = "Messwerte mit Diagramm"

[settings.sensor_table_observations]
label = "Messwerte in der Tabelle"

[settings.sensor_battery_status]
label = "Batteriewerte"
help = "Werden als gut oder schwach gezeigt statt als Zahl."

[settings.computer_monitor_diagram_period]
label = "Zeitraum"

[settings.computer_monitor_stat_tile_observations]
label = "Messwerte mit Kachel"

[settings.computer_monitor_diagram_observations]
label = "Messwerte mit Diagramm"

[settings.computer_monitor_table_observations]
label = "Messwerte in der Tabelle"
