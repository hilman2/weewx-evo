# Die Wörter, die in einer Einheit stecken. Nur die, die anders
# heißen -- "°C" ist überall "°C".
[units]
day = [" Tag", " Tage"]
hour = [" Stunde", " Stunden"]
minute = [" Minute", " Minuten"]
second = [" Sekunde", " Sekunden"]
meter = " m"
foot = " Fuß"
