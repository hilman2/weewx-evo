{"when": 1788525149.0087628, "text": "# The weewx-evo plugin catalogue.\n#\n# One entry per plugin. This file is the whole index: `weewx-evo` reads it so\n# that adding a plugin is choosing from a list rather than pasting a URL, and\n# a person reads it to see what exists.\n#\n# It is deliberately a list of pointers and not a monorepo. Each plugin has\n# its own repository, its own issues, its own releases and its own maintainer\n# -- which is what lets somebody who is not us keep one alive. The mistake to\n# avoid is the one weewx-DWD made: ten unrelated things in one package, where\n# a change to the radar code can break the forecast.\n#\n# ## Adding one\n#\n# Open a pull request that adds a block. What is checked before it is merged:\n#\n#   - it installs, and `weewx-evo <kind> list` shows it afterwards\n#   - it has a licence, and one compatible with GPL-3.0-or-later\n#   - `options()` returns something the settings page can render\n#   - the README says what it is for in the first paragraph\n#\n# Nothing here is a judgement about quality. The catalogue says a plugin\n# exists and what it claims to do; whether it is any good is between its\n# author and the people using it.\n#\n# ## The fields\n#\n#   name        what `pip install` and `weewx-evo plugin install` take\n#   kind        driver | export | upload | feed | forecast\n#   provides    the name it registers, which is what goes in `kind = \"...\"`\n#   summary     one line, said the way the settings page will show it\n#   repository  where it lives\n#   licence     SPDX identifier\n#   tested      the weewx-evo version its author last checked it against\n#   author      who to open an issue with\n#\n# `tested` is not a compatibility range. It is one fact -- what somebody\n# actually ran it against -- because a range is a promise nobody can keep and\n# a plugin that says \"any version\" is saying nothing.\n#\n# ## `detects`, and why it lives here\n#\n# With no driver installed, a console set up against a fresh weewx-evo uploads\n# with the right token and nothing can read it. The core keeps what arrived --\n# the path and the first 160 bytes -- and matches it against these, so the\n# page can say *something is uploading that looks like an Ecowitt custom\n# upload, this add-on reads it* instead of leaving somebody to compare a log\n# line against this file.\n#\n# The patterns are here rather than in the core on purpose: the core would\n# otherwise have to know the protocols it no longer ships, which is the whole\n# thing this arrangement removes. It matches strings this file gave it.\n#\n#   body      every one of these must appear. Case-sensitive.\n#   not_body  none of these may appear.\n#   path      any one of these, as a substring of the upload path.\n#\n# Read off each protocol's own `claims()` rather than invented, and the pair\n# that needs `not_body` shows why one list would not do: an Ecowitt custom\n# upload and an Ambient one both carry a PASSKEY, and what tells them apart\n# is that Ambient's `stationtype` begins with AMBWeather.\n#\n# More than one may match, and that is not a failure. The page offers what\n# matched and says so; guessing between them from 160 bytes would be a wrong\n# add-on installed with no sign of why.\n#\n# ## What is not listed\n#\n# A package that provides nothing on its own. `weewx-evo-push-common` carries\n# the parts every push protocol shares, and installing it alone registers no\n# protocol and answers on no endpoint -- so it is a dependency of the drivers\n# that need it and pip brings it along. A catalogue of things somebody can\n# choose should not offer one that does nothing when chosen.\n#\n# That is also why plugins depending on each other needs nothing here: it is\n# a line in the dependent plugin's `pyproject.toml`, which pip already\n# resolves. An index that had to know about it would be a package manager.\n\nversion = 1\n\n[[plugin]]\nname = \"weewx-evo-sftp\"\nkind = \"export\"\nprovides = \"sftp\"\nsummary = \"A server that offers SSH but no rsync. Keys only, and it remembers what it already sent.\"\nrepository = \"https://github.com/weewx-evo/weewx-evo-sftp\"\nlicence = \"GPL-3.0-or-later\"\ntested = \"0.0.1\"\nauthor = \"hilman2\"\n\n[[plugin]]\nname = \"weewx-evo-ecowitt\"\nkind = \"driver\"\nprovides = \"ecowitt\"\ndetects = { body = [\"PASSKEY=\"], not_body = [\"AMBWeather\"] }\nsummary = \"Ecowitt custom upload. GW1000 to GW3000, HP2551, HP2561, WS3800 and their rebadges.\"\nrepository = \"https://github.com/weewx-evo/weewx-evo-ecowitt\"\nlicence = \"GPL-3.0-or-later\"\ntested = \"0.0.1\"\nauthor = \"hilman2\"\n\n[[plugin]]\nname = \"weewx-evo-ambient\"\nkind = \"driver\"\nprovides = \"ambient\"\ndetects = { body = [\"PASSKEY=\", \"AMBWeather\"] }\nsummary = \"Ambient Weather custom upload. WS-2902, WS-5000, WS-1965 and the rest of the range.\"\nrepository = \"https://github.com/weewx-evo/weewx-evo-ambient\"\nlicence = \"GPL-3.0-or-later\"\ntested = \"0.0.1\"\nauthor = \"hilman2\"\n\n[[plugin]]\nname = \"weewx-evo-acurite\"\nkind = \"driver\"\nprovides = \"acurite\"\ndetects = { body = [\"mt=\", \"id=\"] }\nsummary = \"Acurite smartHUB and Access bridges, with a 5-in-1, towers, Pro sensors and the 899 rain gauge.\"\nrepository = \"https://github.com/weewx-evo/weewx-evo-acurite\"\nlicence = \"GPL-3.0-or-later\"\ntested = \"0.0.1\"\nauthor = \"hilman2\"\n\n[[plugin]]\nname = \"weewx-evo-lacrosse\"\nkind = \"driver\"\nprovides = \"lacrosse\"\ndetects = { body = [\"mac=\", \"id=\"] }\nsummary = \"LaCrosse LW301 and LW302 gateways, with the wind, rain, UV and temperature sensors.\"\nrepository = \"https://github.com/weewx-evo/weewx-evo-lacrosse\"\nlicence = \"GPL-3.0-or-later\"\ntested = \"0.0.1\"\nauthor = \"hilman2\"\n\n[[plugin]]\nname = \"weewx-evo-wunderground\"\nkind = \"driver\"\nprovides = \"wunderground\"\ndetects = { body = [\"action=updateraw\"], path = [\"/weatherstation/updateweatherstation.php\"] }\nsummary = \"The Weather Underground PWS upload. Fine Offset Observer consoles, any Ecowitt set to Wunderground, Meteobridge.\"\nrepository = \"https://github.com/weewx-evo/weewx-evo-wunderground\"\nlicence = \"GPL-3.0-or-later\"\ntested = \"0.0.1\"\nauthor = \"hilman2\"\n\n[[plugin]]\nname = \"weewx-evo-weatherflow\"\nkind = \"driver\"\nprovides = \"weatherflow\"\ndetects = { body = [\"serial_number\", \"hub_sn\"] }\nsummary = \"WeatherFlow Tempest, and the AIR and SKY before it, read off the hub's own UDP broadcast.\"\nrepository = \"https://github.com/weewx-evo/weewx-evo-weatherflow\"\nlicence = \"GPL-3.0-or-later\"\ntested = \"0.0.1\"\nauthor = \"hilman2\"\n\n[[plugin]]\nname = \"weewx-evo-rtl433\"\nkind = \"driver\"\nprovides = \"rtl433\"\ndetects = { body = [\"\\\"model\\\"\", \"\\\"time\\\"\"] }\nsummary = \"Cheap 433, 868 and 915 MHz sensors heard with an RTL-SDR stick, by way of rtl_433.\"\nrepository = \"https://github.com/weewx-evo/weewx-evo-rtl433\"\nlicence = \"GPL-3.0-or-later\"\ntested = \"0.0.1\"\nauthor = \"hilman2\"\n\n# Asked rather than listened for. Same kind and same entry point: that these\n# have to be asked is a property of their protocol, not a second sort of\n# plugin, and nothing on the settings page needs to know which it is.\n[[plugin]]\nname = \"weewx-evo-purpleair\"\nkind = \"driver\"\nprovides = \"purpleair\"\nsummary = \"PurpleAir PA-II, PA-II-SD and PA-I air quality sensors, asked on the local network.\"\nrepository = \"https://github.com/weewx-evo/weewx-evo-purpleair\"\nlicence = \"GPL-3.0-or-later\"\ntested = \"0.0.1\"\nauthor = \"hilman2\"\n\n[[plugin]]\nname = \"weewx-evo-airlink\"\nkind = \"driver\"\nprovides = \"airlink\"\nsummary = \"Davis AirLink air quality sensors, asked on the local network.\"\nrepository = \"https://github.com/weewx-evo/weewx-evo-airlink\"\nlicence = \"GPL-3.0-or-later\"\ntested = \"0.0.1\"\nauthor = \"hilman2\"\n\n# The same hardware as weewx-evo-ecowitt, reached the other way: asked on its\n# own API instead of configured to upload. For a console somebody else set up,\n# or one whose custom-upload slot is taken.\n[[plugin]]\nname = \"weewx-evo-ecowitt-gateway\"\nkind = \"driver\"\nprovides = \"ecowitt_gateway\"\nsummary = \"An Ecowitt gateway asked on its own API over TCP 45000, for a console that cannot be pointed here.\"\nrepository = \"https://github.com/weewx-evo/weewx-evo-ecowitt-gateway\"\nlicence = \"GPL-3.0-or-later\"\ntested = \"0.0.1\"\nauthor = \"hilman2\"\n\n# Depends on weewx-evo-ambient, which pip brings along: a station reporting\n# through the service sends the same fields under the same names as one\n# posting here, so the two share a catalog rather than keeping copies that\n# must not disagree.\n[[plugin]]\nname = \"weewx-evo-ambient-cloud\"\nkind = \"driver\"\nprovides = \"ambient_cloud\"\nsummary = \"Ambient Weather stations read through ambientweather.net, for hardware that is not on this network.\"\nrepository = \"https://github.com/weewx-evo/weewx-evo-ambient-cloud\"\nlicence = \"GPL-3.0-or-later\"\ntested = \"0.0.1\"\nauthor = \"hilman2\"\n\n[[plugin]]\nname = \"weewx-evo-homeassistant\"\nkind = \"driver\"\nprovides = \"homeassistant\"\nsummary = \"Any sensor Home Assistant integrates, read over its REST API. Which entities is yours to choose.\"\nrepository = \"https://github.com/weewx-evo/weewx-evo-homeassistant\"\nlicence = \"GPL-3.0-or-later\"\ntested = \"0.0.1\"\nauthor = \"hilman2\"\n"}