# Push docs/ into the wiki whenever it changes on main.
#
# The wiki lives in its own repository (weewx-evo.wiki.git), so `docs/` and the
# published wiki are two copies of the same pages. Two copies drift the moment
# somebody changes one and forgets the other, which is the failure this file
# exists to make impossible rather than to warn about.
#
# `docs/` is the source. Anything edited in the wiki's own web editor is
# overwritten by the next run -- said in Contributing so that nobody finds out
# by losing an edit.
name: wiki

on:
  push:
    branches: [main]
    paths: ['docs/**']
  # Run it by hand after enabling the wiki, or to repair a divergence.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Two runs pushing to one repository race, and the loser fails on a
  # non-fast-forward. Queued instead: the later state is the one that wins.
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: The repository
        uses: actions/checkout@v4

      - name: The wiki
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" \
            wiki

      - name: Copy the pages in
        run: |
          # Deleted here means deleted there: the wiki keeps a page nobody
          # links to any more otherwise, and it goes on being found by search.
          # `.git` is the one thing not to touch.
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp docs/*.md wiki/
          if [ -d docs/images ]; then
            mkdir -p wiki/images
            cp docs/images/* wiki/images/
          fi

      - name: Push, if anything moved
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # A push with nothing in it fails, and a red run for "nothing
          # changed" is a red run people learn to ignore.
          if git diff --cached --quiet; then
            echo "The wiki already matches docs/."
            exit 0
          fi
          git commit -m "docs/ at ${GITHUB_SHA:0:7}"
          git push origin HEAD:master
