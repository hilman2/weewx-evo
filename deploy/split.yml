# The listener and the archiver as separate services.
#
# `compose.yml` runs both in one process, which is right for a small machine
# and what the development instance does. This is the other arrangement, and it
# is the answer to "can a driver be stopped from writing to the archive".
#
# In-process it cannot. A driver is Python running in the same interpreter and
# `import sqlite3` is all it takes; no interface prevents code from going
# around an interface. What does prevent it is not having the file.
#
#   * The listener holds the drivers. It mounts the live database read-write
#     and the archive not at all. A driver in it can try whatever it likes.
#   * The archiver holds no drivers, listens on nothing, and mounts both. It
#     reads packets the listener wrote and writes records.
#
# They never speak to each other. The live database is the entire interface,
# which is what makes splitting them a change to this file and to nothing else.
#
#   docker compose -f compose.yml -f split.yml up -d

services:
  weewx-evo:
    # The listener. Drivers run here, and here there is no archive.
    command: ["listen"]
    volumes:
      - /opt/weewx-evo/data/live:/data
    environment:
      - WEEWX_EVO_LIVE=/data/live.sdb
      # No WEEWX_EVO_ARCHIVE. A driver that wants somewhere to remember
      # something gets a file in /data, not the archive's metadata table.
      - WEEWX_EVO_STATE_DIR=/data
      - WEEWX_EVO_DRIVER_DIR=/data/drivers
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  weewx-evo-archiver:
    image: weewx-evo:local
    container_name: weewx-evo-archiver
    restart: unless-stopped
    mem_limit: 256m
    command: ["archive", "--spool", "/data/packets"]
    volumes:
      # The live database read-only: this side only ever reads packets.
      - /opt/weewx-evo/data/live:/data/live:ro
      - /opt/weewx-evo/data/archive:/data
    environment:
      - TZ=Europe/Berlin
      - WEEWX_EVO_LIVE=/data/live/live.sdb
      - WEEWX_EVO_ARCHIVE=/data/weewx.sdb
      # Not set here. The paths above are container layout and belong in
      # this file; the interval and the retention are settings, and a value
      # here would outrank the one on the settings page without saying so.
      - WEEWX_EVO_INTERVAL=${WEEWX_EVO_INTERVAL:-}
      - WEEWX_EVO_RETENTION_DAYS=${WEEWX_EVO_RETENTION_DAYS:-}
    # No ports. Nothing reaches this from outside, and it reaches nothing.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: journald
      options:
        tag: "weewx-evo-archiver"

# Two notes on the split, both learned the hard way elsewhere:
#
#   * Retention belongs to the archiver, not the listener. Packets may only be
#     dropped once they are in a record, and only this side knows that.
#   * The live database is opened read-only here, but SQLite in WAL mode needs
#     to write `-shm` and `-wal` beside it to read at all. Mounting the
#     directory read-only is therefore not the same as mounting the file
#     read-only, and the former will fail. Use a user without write permission
#     on the archive instead, which is the check that actually matters.
