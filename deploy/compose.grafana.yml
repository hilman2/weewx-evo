# InfluxDB and Grafana, as an overlay.
#
#     docker compose -f compose.yml -f compose.grafana.yml up -d
#
# An overlay and not a replacement, on purpose. A station in a shed shares its
# machine with other things, InfluxDB wants half a gigabyte and Grafana wants
# a quarter, and somebody running one console on a Raspberry Pi should not pay
# for a comparison they will never draw. The base `compose.yml` sets a 256 MB
# limit on weewx-evo itself with exactly that reasoning.
#
# What it takes from `.env`:
#
#     INFLUX_TOKEN        the write token. weewx-evo's InfluxDB upload uses
#                         the same one -- set it on the settings page.
#     INFLUX_READ_TOKEN   optional. Grafana only reads, so give it a token
#                         that only reads; `grafana provision --read-token`
#                         writes it into the datasource.
#     GRAFANA_PASSWORD    the admin password. There is no default: a Grafana
#                         reachable on a home network with admin/admin is a
#                         weather station somebody else can reconfigure.
#
# Then, once weewx-evo has an InfluxDB upload configured:
#
#     docker compose exec weewx-evo weewx-evo grafana provision \
#         --out /data/grafana --read-token "$INFLUX_READ_TOKEN"
#     docker compose restart grafana
#
# Grafana reads the provisioning directory at start and rescans the dashboards
# every minute, so a later `provision` needs no restart -- only a new
# datasource does.

services:
  influxdb:
    image: influxdb:2.7-alpine
    container_name: weewx-evo-influxdb
    restart: unless-stopped

    # Loopback. Nothing outside this machine has business writing weather
    # readings, and weewx-evo reaches it over the compose network by name.
    ports:
      - "127.0.0.1:${INFLUX_PORT:-8086}:8086"

    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_USER:-weewx}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD:?set INFLUX_PASSWORD in .env}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG:-weewx-evo}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET:-weewx}
      # Zero means keep everything. This is the measurement series, not a
      # cache: a retention policy that quietly drops last winter is the one
      # thing this must not do.
      - DOCKER_INFLUXDB_INIT_RETENTION=${INFLUX_RETENTION:-0}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN:?set INFLUX_TOKEN in .env}

    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2

    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:11.3.0
    container_name: weewx-evo-grafana
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy

    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      # The station's own zone, so a day on a chart is the day the readings
      # were taken in. Same reasoning as TZ on weewx-evo itself.
      - TZ=${TZ:-Europe/Berlin}
      # A dashboard is a weather page. Anonymous viewing turns the screen in
      # the hall into something anybody in the house can look at without a
      # login, and Viewer cannot change anything.
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS:-false}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_DEFAULT_THEME=${GRAFANA_THEME:-dark}
      # Which dashboard the front door opens on. The generated "now" board is
      # the one somebody wants nine times out of ten.
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/weewx-evo-now.json
      # Nothing here phones home.
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false

    volumes:
      - grafana-data:/var/lib/grafana
      # What `weewx-evo grafana provision --out /data/grafana` wrote. Read
      # only: these files are generated, and an edit made here would be
      # silently overwritten on the next run.
      - ${WEEWX_EVO_DATA:-../data}/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ${WEEWX_EVO_DATA:-../data}/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
